[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gridpulse-power-plant-intelligence"
version = "0.1.0"
description = "Traceable public-data analytics foundation for power generation and maintenance research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "openpyxl>=3.1,<4.0",
  "numpy>=1.26,<3.0",
  "pandas>=2.2,<4.0",
  "scikit-learn>=1.5,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10.0",
  "httpx>=0.27,<1.0",
  "ruff>=0.6,<1.0",
]
local-llm = [
  "llama-cpp-python>=0.3,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
