name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest -q
      - name: Check dashboard JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for name, source in [
              ("dashboard", Path("index.html")),
              ("maintenance-console", Path("docs/maintenance-console.html")),
              ("offline-ai-console", Path("docs/offline-ai-console.html")),
              ("plant-intelligence-suite", Path("docs/plant-intelligence-suite.html")),
              ("data-quality-review", Path("docs/data-quality-review.html")), ("mep-studio", Path("docs/mep-studio.html")),
          ]:
              html = source.read_text(encoding="utf-8")
              scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.DOTALL)
              if len(scripts) != 1:
                  raise SystemExit(f"Expected one inline script in {source}, found {len(scripts)}")
              Path(f"/tmp/gridpulse-{name}.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/gridpulse-dashboard.js
          node --check /tmp/gridpulse-maintenance-console.js
          node --check /tmp/gridpulse-offline-ai-console.js
          node --check /tmp/gridpulse-plant-intelligence-suite.js
          node --check /tmp/gridpulse-data-quality-review.js
          node --check /tmp/gridpulse-mep-studio.js
      - name: Check plant CAD JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          source = Path("docs/refinery-a0.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", source, flags=re.DOTALL | re.IGNORECASE)
          inline_scripts = [script for script in scripts if script.strip()]
          if not inline_scripts:
              raise SystemExit("No inline JavaScript found in plant CAD")
          for index, script in enumerate(inline_scripts, start=1):
              Path(f"/tmp/gridpulse-plant-cad-{index}.js").write_text(script, encoding="utf-8")
          print(f"Found {len(inline_scripts)} inline CAD script(s)")
          PY
          for script in /tmp/gridpulse-plant-cad-*.js; do node --check "$script"; done

      - name: Check style
        run: ruff check src tests

      - name: Build and smoke-test hardened API container with persistent volume
        run: |
          set -euo pipefail
          export GRIDPULSE_API_KEY=ci-test-secret
          docker compose config -q
          docker compose up -d --build
          trap 'docker compose logs gridpulse-api || true; docker compose down -v || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/ready
          unauthorized=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/sources)
          test "$unauthorized" = "401"
          curl -fsS -H 'X-API-Key: ci-test-secret' http://127.0.0.1:8000/api/v1/sources
          curl -fsS -X POST http://127.0.0.1:8000/api/v1/observations \
            -H 'X-API-Key: ci-test-secret' \
            -H 'Content-Type: application/json' \
            -d '{"records":[{"record_id":"CI-OBS-1","plant":"CI fixture","metric":"net_generation","value":10,"unit":"MWh","period_start":"2026-01-01","period_end":"2026-01-01","scope":"plant","source_id":"SRC-001","verification_status":"unverified"}]}'
          curl -fsS -H 'X-API-Key: ci-test-secret' 'http://127.0.0.1:8000/api/v1/audit/events?entity_id=CI-OBS-1'
          backup_output=$(docker compose exec -T gridpulse-api python -m gridpulse.backup backup \
            --database /data/gridpulse.sqlite3 --output-dir /data/backups)
          backup_file=$(printf '%s' "$backup_output" | python -c 'import json,sys; print(json.load(sys.stdin)["backup"])')
          docker compose exec -T gridpulse-api python -m gridpulse.backup verify --backup "$backup_file"
          docker compose exec -T gridpulse-api python -m gridpulse.backup restore \
            --backup "$backup_file" --destination /data/restored-ci.sqlite3
          docker compose exec -T gridpulse-api python -c "import sqlite3; db=sqlite3.connect('/data/restored-ci.sqlite3'); assert db.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'; db.close()"
          docker compose restart gridpulse-api
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS -H 'X-API-Key: ci-test-secret' 'http://127.0.0.1:8000/api/v1/observations?plant=CI%20fixture' | grep -q 'CI-OBS-1'
