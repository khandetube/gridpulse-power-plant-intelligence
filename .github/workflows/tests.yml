name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest -q
      - name: Check dashboard JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.DOTALL)
          if len(scripts) != 1:
              raise SystemExit(f"Expected one inline dashboard script, found {len(scripts)}")
          Path("/tmp/gridpulse-dashboard.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/gridpulse-dashboard.js
      - name: Check style
        run: ruff check src tests

      - name: Build and smoke-test hardened API container
        run: |
          set -euo pipefail
          docker build -t gridpulse-api:ci .
          docker run -d --name gridpulse-api-ci \
            -p 127.0.0.1:8000:8000 \
            --read-only \
            --tmpfs /tmp:size=16m,noexec,nosuid \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            -e GRIDPULSE_DB_PATH=/tmp/gridpulse-ci.sqlite3 \
            gridpulse-api:ci
          trap 'docker logs gridpulse-api-ci || true; docker rm -f gridpulse-api-ci || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/api/v1/sources
          curl -fsS -X POST http://127.0.0.1:8000/api/v1/observations \
            -H 'Content-Type: application/json' \
            -d '{"records":[{"record_id":"CI-OBS-1","plant":"CI fixture","metric":"net_generation","value":10,"unit":"MWh","period_start":"2026-01-01","period_end":"2026-01-01","scope":"plant","source_id":"SRC-001","verification_status":"unverified"}]}'
          curl -fsS 'http://127.0.0.1:8000/api/v1/audit/events?entity_id=CI-OBS-1'

