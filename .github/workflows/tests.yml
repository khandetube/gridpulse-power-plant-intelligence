name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest -q
      - name: Check dashboard JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.DOTALL)
          if len(scripts) != 1:
              raise SystemExit(f"Expected one inline dashboard script, found {len(scripts)}")
          Path("/tmp/gridpulse-dashboard.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/gridpulse-dashboard.js
      - name: Check style
        run: ruff check src tests
