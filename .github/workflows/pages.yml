name: Deploy GridPulse dashboard

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - ".github/workflows/pages.yml"
      - "docs/**"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Inject advanced 3D renderer safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/prompt-to-engineering-cad.html')
          text = p.read_text(encoding='utf-8')
          tags = (
              '<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>'
              '<script src="assets/gridpulse-advanced-3d.js"></script>'
              '<script src="assets/gridpulse-3d-overlay-guard.js"></script>'
          )
          marker = '</body>'
          if marker not in text:
              raise SystemExit('CAD page has no </body> marker; refusing unsafe injection')
          if 'assets/gridpulse-advanced-3d.js' not in text:
              text = text.replace(marker, tags + marker, 1)
          elif 'assets/gridpulse-3d-overlay-guard.js' not in text:
              text = text.replace(marker, '<script src="assets/gridpulse-3d-overlay-guard.js"></script>' + marker, 1)
          p.write_text(text, encoding='utf-8')
          print('Advanced 3D renderer and overlay guard prepared.')
          PY
      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
