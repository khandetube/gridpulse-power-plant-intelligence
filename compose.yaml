services:
  gridpulse-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: gridpulse-api:local
    environment:
      GRIDPULSE_DB_PATH: /data/gridpulse.sqlite3
      GRIDPULSE_ENV: production
      GRIDPULSE_API_KEY: ${GRIDPULSE_API_KEY:-}
    volumes:
      - gridpulse-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  gridpulse-data:
